<html><head><title>FAQ</title><script type="application/ld+json">{"@context": "https://schema.org", "@type": "FAQPage", "name": "سوالات متداول (FAQ)", "url": "https://www.paziresh24.com/faq/", "inLanguage": "fa", "mainEntity": [{"@type": "Question", "name": "چگونه نوبت دریافتی را لغو کنیم؟", "acceptedAnswer": {"@type": "Answer", "text": "از بخش «نوبت‌های من» در پنل کاربری خود (اپلیکیشن یا وب‌سایت) می‌توانید نوبت ثبت‌شده را لغو کنید. توجه داشته باشید زمانی می‌توان نوبت آنلاین را لغو نمود که زمان ویزیت آنلاین فرا نرسیده باشد. در غیر این صورت در هنگام گفتگو با پزشک امکان لغو ویزیت آنلاین امکان‌پذیر نیست."}}, {"@type": "Question", "name": "آیا در ویزیت آنلاین امکان لغو نوبت وجود دارد؟", "acceptedAnswer": {"@type": "Answer", "text": "جهت لغو نوبت در صورتی که هنوز زمان تقریبی نوبت شما فرا نرسیده است، می‌توانید با ورود به پنل کاربری (سایت یا اپلیکیشن) نوبت را لغو کنید. هزینه پرداختی به‌صورت خودکار بین 1 الی 72 ساعت کاری به حساب شما برگشت داده می‌شود. در صورتی که زمان نوبت گذشته باشد و به هر دلیلی قصد حذف آن را دارید با پشتیبانی پذیرش ۲۴ تماس حاصل فرمایید."}}, {"@type": "Question", "name": "چگونه در پذیرش۲۴، از پزشک مورد نظر، نوبت حضوری دریافت کنم؟", "acceptedAnswer": {"@type": "Answer", "text": "با مطالعه راهنمای دریافت نوبت در وب‌سایت پذیرش۲۴، نحوه دریافت نوبت حضوری به‌صورت گام‌به‌گام آموزش داده شده است."}}, {"@type": "Question", "name": "آیا نوبت من در پذیرش۲۴ واقعا ثبت می‌شود؟", "acceptedAnswer": {"@type": "Answer", "text": "بله. در پایان مرحله نوبت‌دهی، یک کد رهگیری به شما تخصیص می‌یابد که نشانه روند صحیح شما در دریافت نوبت از پزشک مورد نظر می‌باشد."}}]}</script></head><body></body></html>
