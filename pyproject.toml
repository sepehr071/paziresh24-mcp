[project]
name = "paziresh24-mcp"
version = "0.1.0"
description = "Unofficial read-only MCP server for Paziresh24: find doctors, read profiles, prices and reviews, and see free appointment slots."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Sepehr", email = "sepehr@nextofx.com" }]
requires-python = ">=3.10"
keywords = ["mcp", "model-context-protocol", "paziresh24", "iran", "doctor", "appointment", "healthcare", "online-visit"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "mcp>=2.2,<3",
    "httpx>=0.27",
]

[project.urls]
Homepage = "https://github.com/sepehr071/paziresh24-mcp"
Source = "https://github.com/sepehr071/paziresh24-mcp"
Changelog = "https://github.com/sepehr071/paziresh24-mcp/releases"
Issues = "https://github.com/sepehr071/paziresh24-mcp/issues"

[project.scripts]
paziresh24-mcp = "paziresh24_mcp.server:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
exclude = ["CLAUDE.md"]  # local notes, not part of the package

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = ["live: calls the real Paziresh24 APIs (run with -m live)"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]  # long Field(description=...) strings read better on one line
